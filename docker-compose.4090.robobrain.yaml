# ============================================================
# RoboBrain2.5-4B @ RTX 4090 CUDA
#
# 一键启动:
#   docker compose -f docker-compose.4090.robobrain.yaml up -d
# ============================================================

services:
  robobrain-4090:
    image: roboagent:4090-cuda
    container_name: robobrain-4090-server
    hostname: 4090-robobrain
    restart: unless-stopped

    ports:
      - "8083:8080"

    volumes:
      - ./models:/app/models:ro
      - /mnt/e/Projects/r005Test/models/RoboBrain2.5-4B-GGUF/RoboBrain2.5-4B.Q4_K_M.gguf:/app/models/RoboBrain2.5-4B.Q4_K_M.gguf:ro
      - ./models/mmproj-F16.gguf:/app/models/mmproj-F16.gguf:ro
      - ./logs:/app/logs

    command: >
      -m /app/models/RoboBrain2.5-4B.Q4_K_M.gguf
      --mmproj /app/models/mmproj-F16.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --threads 8
      --threads-batch 8
      --batch-size 4096
      --ubatch-size 1024
      --n-gpu-layers 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --flash-attn on
      --no-mmap
      --verbose

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - TZ=Asia/Shanghai

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - 4090-net

networks:
  4090-net:
    driver: bridge
